[project]
name = "cinepolis-natal-api"
version = "0.1.0"
description = "Movie theater tickets API built with Django REST Framework"
authors = [
    {name = "Matheus Duarte",email = "matheusduartenatal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "gunicorn (>=25.1.0,<26.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "celery (>=5.6.2,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)"
]
